# CI : lint + tests sur chaque push / pull request.
name: CI (lint + tests)

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Dashboard JavaScript syntax
        run: |
          node --check public/activity-board.js
          node --check public/arabic-locale.js
          node --check public/family-view.js
          node --check public/family-content-gate.js
          node --check public/family-reasons.js
          node --check public/freshness-gate.js
          node --check public/locale-transition.js
          node --check public/mobile-ergonomics.js
          node --check public/port-knowledge.js
          node --check public/pwa-install.js
          node --check public/reasons-debug.js
          node --check public/simple-view.js
          node --check public/verdict-hero.js
          node --check public/js/corridor.js
          node --check public/js/day-selection.js
          node --check public/js/i18n.js
          node --check public/js/map.js
          node --check public/js/navigation-windows.js
          node --check public/js/navigation-verdicts.js
          node --check public/js/reasons-i18n.js
          node --check public/js/verdict.js

      - name: Mobile_view JavaScript syntax
        run: |
          node --check public/mobile/js/app.js
          node --check public/mobile/js/carte.js
          node --check public/mobile/js/chart.js
          node --check public/mobile/js/data.js
          node --check public/mobile/js/decision.js
          node --check public/mobile/js/engine-assessment.js
          node --check public/mobile/js/format.js
          node --check public/mobile/js/hour-verdict.js
          node --check public/mobile/js/runs.js
          node --check public/mobile/js/spot.js
          node --check public/mobile/js/thresholds.js
          node --check public/mobile/js/ui.js

      - name: Generate and validate published app module
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from fable.dashboard_patch import patch_dashboard_index
          target = Path('/tmp/fable-public')
          shutil.copytree('public', target)
          patch_dashboard_index(target / 'index.html')
          PY
          node --check /tmp/fable-public/js/app.js

      - name: Dashboard JavaScript tests
        run: node --test tests/js/*.test.mjs

      - name: Pytest
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 7
