# FABLE Knowledge Pack — source de connaissance métier indépendante du moteur.
version: 3
status: port_knowledge_tunable
language_default: fr

schema:
  fish_intelligence: 1
  terminal_tackle: 1
  validation_metadata: 1
  port_navigation: 1
  shelter_intelligence: 1
  offshore_one_way: 1

ranking:
  max_per_window: 3
  max_total: 5
  preferred_period_bonus: 7
  lunar_max_bonus: 5
  tide_range_full_bonus_m: 0.25

advisories:
  # Seuils des conseils de confort. Ils ne bloquent jamais une activite :
  # la securite reste entierement du ressort du moteur de fenetres.
  uv_index_high: 7            # OMS : 6-7 eleve, 8-10 tres eleve
  apparent_temperature_c_high: 38
  onshore_share_high: 0.5
  offshore_share_low: 0.2
  precipitation_mm: 0.5

policy:
  safety_gate: family_go_required
  lunar_role: secondary_ranking_only
  local_validation_required: true
  offshore_profiles_require_separate_validation: true
  offshore_same_day_round_trip_required: false
  shelter_bonus_requires_field_validation: true
  unvalidated_shelters_never_relax_thresholds: true
  gear_ranges_are_indicative: true
  regulatory_check_required_before_trip: true
